[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ndews"
version = "0.2.0"
description = "Neural Degeneration Early Warning System — predicts training instability via internal telemetry"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0,<3.0",
    "torchvision>=0.15,<1.0",
    "numpy>=1.24,<3.0",
    "scikit-learn>=1.3,<2.0",
    "pandas>=2.0,<3.0",
    "matplotlib>=3.7,<4.0",
    "tqdm>=4.65",
    "PyYAML>=6.0",
]

[tool.setuptools.packages.find]
where = ["."]
# Only the library ships; the CIFAR harness under examples/ is not packaged.
include = ["ndews*", "analysis*"]

[tool.setuptools.package-data]
ndews = ["py.typed"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.pytest.ini_options]
# Put the repo root on sys.path so `import ndews` works without `pip install -e .`.
pythonpath = ["."]
testpaths = ["tests"]
